name: One-time routine post cancellation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cancel-routine-posts-once.yml"

permissions:
  contents: read

jobs:
  cancel-approved-routine-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Delete only the six approved postponed posts
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414558
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414559
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414560
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414565
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414566
          CONFIRM_PUBLISH=YES python publisher.py --delete-post-id 414567
