name: Check VK user photo access
# Check matching VK RU API domain: 2026-08-05

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-user-photo.yml"

permissions:
  contents: read
  statuses: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify user token without publishing
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          result_path = "/tmp/vk-check.env"

          def finish(ok, stage, code):
              safe_stage = "".join(ch for ch in str(stage) if ch.isalnum() or ch == "-")[:24]
              safe_code = "".join(ch for ch in str(code) if ch.isalnum() or ch == "-")[:16]
              with open(result_path, "w", encoding="utf-8") as handle:
                  handle.write(f"OK={'1' if ok else '0'}\n")
                  handle.write(f"STAGE={safe_stage or 'unknown'}\n")
                  handle.write(f"CODE={safe_code or 'unknown'}\n")
              raise SystemExit(0 if ok else 1)

          token = os.environ.get("VK_USER_TOKEN", "")
          if not token:
              finish(False, "secret", "missing")

          def vkid_user_info():
              query = urllib.parse.urlencode({"client_id": "54708342"})
              body = urllib.parse.urlencode({"access_token": token}).encode()
              request = urllib.request.Request(
                  f"https://id.vk.ru/oauth2/user_info?{query}",
                  data=body,
                  headers={"User-Agent": "vk-news-collector-user-token-check/1.3"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      document = json.load(response)
              except urllib.error.HTTPError as exc:
                  finish(False, "vkid-userinfo", f"http{exc.code}")
              except Exception:
                  finish(False, "vkid-userinfo", "network")
              if "error" in document:
                  finish(False, "vkid-userinfo", document.get("error", "oauth"))
              if not isinstance(document.get("user"), dict):
                  finish(False, "vkid-userinfo", "empty")

          vkid_user_info()

          def vk(method, **params):
              payload = urllib.parse.urlencode({
                  "access_token": token,
                  "v": "5.199",
                  **params,
              }).encode()
              request = urllib.request.Request(
                  f"https://api.vk.ru/method/{method}",
                  data=payload,
                  headers={"User-Agent": "vk-news-collector-user-token-check/1.2"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      document = json.load(response)
              except urllib.error.HTTPError as exc:
                  finish(False, method, f"http{exc.code}")
              except Exception:
                  finish(False, method, "network")
              if "error" in document:
                  finish(False, method, document["error"].get("error_code", "api"))
              return document.get("response")

          users = vk("users.get")
          if not users:
              finish(False, "users-get", "empty")

          server = vk("photos.getWallUploadServer", group_id=70948047)
          if not isinstance(server, dict) or not server.get("upload_url"):
              finish(False, "photo-server", "empty")

          print(json.dumps({
              "status": "ok",
              "group_id": 70948047,
              "wall_photo_upload_allowed": True,
              "published": False,
              "uploaded": False,
          }, ensure_ascii=False))
          finish(True, "photo-server", "ok")
          PY
          RESULT=$?
          if [ -f /tmp/vk-check.env ]; then
            . /tmp/vk-check.env
          else
            OK=0
            STAGE=script
            CODE=unexpected
          fi
          if [ "$OK" = "1" ]; then
            STATE=success
            CONTEXT="vk-user-photo-check-ok"
            DESCRIPTION="VK user token can request wall photo upload"
          else
            STATE=error
            CONTEXT="vk-user-photo-check-error-$STAGE-$CODE"
            DESCRIPTION="VK user photo access check failed safely"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$CONTEXT" -f description="$DESCRIPTION"
          exit "$RESULT"
