name: Attach approved photo to VK post

on:
  push:
    branches:
      - main
    paths:
      - "attach-photo-request.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vk-publish
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate, attach and report
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIRMED="$(jq -r '.confirmed' attach-photo-request.json)"
          POST_ID="$(jq -r '.post_id' attach-photo-request.json)"
          IMAGE_PATH="$(jq -r '.image_path' attach-photo-request.json)"
          test "$CONFIRMED" = "true"
          test "$POST_ID" = "412425"
          test -f "$IMAGE_PATH"
          set +e
          OUTPUT=$(CONFIRM_ATTACH=YES python attach_photo.py --post-id "$POST_ID" --image "$IMAGE_PATH" 2>&1)
          RESULT=$?
          printf '%s\n' "$OUTPUT"
          LAST_LINE=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -cd '[:alnum:] .:_-' | cut -c1-100)
          if [ "$RESULT" -eq 0 ]; then STATE=success; CONTEXT="vk-photo-attached"; else STATE=error; CONTEXT="vk-photo-error: $LAST_LINE"; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$CONTEXT" -f description="$LAST_LINE"
          exit "$RESULT"
