name: Export selected VK posts for document
on:
  push:
    paths:
      - '.github/workflows/export-post-index-20261112.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Read selected posts
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          VK_ANALYTICS_TOKEN: ${{ secrets.VK_ANALYTICS_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse
          ids=["-70948047_375469","-70948047_375491","-70948047_375572","-70948047_375576","-70948047_375587","-70948047_375588","-70948047_375656","-70948047_375593","-70948047_375702","-70948047_375930","-70948047_375933","-70948047_375931","-70948047_375932","-70948047_375977","-70948047_376136","-70948047_376121","-70948047_376144","-70948047_376365","-70948047_376407","-70948047_376408","-70948047_376409","-70948047_376410","-70948047_376412","-70948047_376420","-70948047_376435","-70948047_376514","-70948047_376720","-70948047_376771","-70948047_376795","-70948047_376803","-70948047_376805","-70948047_376886","-70948047_376869","-70948047_376825","-70948047_377031","-70948047_377034","-70948047_377057","-70948047_377161","-70948047_377277","-70948047_377303","-70948047_377308","-70948047_377365","-70948047_377415","-70948047_377470","-70948047_377780","-70948047_377831","-70948047_377889","-70948047_377970","-70948047_377950","-70948047_378163","-70948047_378186","-70948047_378187","-70948047_378188","-70948047_378209","-70948047_378331","-70948047_378314","-70948047_378581","-70948047_378587","-70948047_378960","-70948047_379103","-70948047_379091","-70948047_379038","-70948047_379037","-70948047_379018","-70948047_379011","-70948047_379001","-70948047_379000","-70948047_379119","-70948047_379192","-70948047_379189","-70948047_379180","-70948047_379216","-70948047_379252","-70948047_379350","-70948047_379357","-70948047_379430","-70948047_379460","-70948047_379447","-70948047_379596","-70948047_379595","-70948047_379612","-70948047_379659","-70948047_379691","-70948047_379693","-70948047_379777","-70948047_379916","-70948047_379793","-70948047_379785","-70948047_379943","-70948047_379941","-70948047_380020","-70948047_380035","-70948047_380069","-70948047_380093","-70948047_380299","-70948047_380211","-70948047_380204","-70948047_380147","-70948047_380395","-70948047_380424","-70948047_380535","-70948047_380464","-70948047_380552","-70948047_380565","-70948047_380674","-70948047_380687","-70948047_380733","-70948047_380743","-70948047_380778","-70948047_380779","-70948047_380780","-70948047_380927","-70948047_380947","-70948047_380949","-70948047_381014","-70948047_381018","-70948047_381029","-70948047_381032","-70948047_381049","-70948047_381061","-70948047_381075","-70948047_381076","-70948047_381148","-70948047_381184","-70948047_381178","-70948047_381235","-70948047_381290","-70948047_381321","-70948047_381374","-70948047_381425"]
          tokens=list(dict.fromkeys(x for x in [os.getenv('VK_SERVICE_TOKEN'),os.getenv('VK_PUBLISH_TOKEN'),os.getenv('VK_ANALYTICS_TOKEN'),os.getenv('VK_USER_TOKEN')] if x))
          result=[]
          for start in range(0,len(ids),100):
              for token in tokens:
                  data=urllib.parse.urlencode({'posts':','.join(ids[start:start+100]),'access_token':token,'v':'5.199'}).encode()
                  with urllib.request.urlopen('https://api.vk.com/method/wall.getById',data=data,timeout=60) as r: d=json.load(r)
                  if 'response' in d: break
              else: raise RuntimeError('VK API error: '+str(d.get('error',{}).get('error_code')))
              response=d['response']
              posts=response.get('items',[]) if isinstance(response,dict) else response
              for p in posts:
                  result.append({k:p.get(k) for k in ['id','owner_id','date','text','is_deleted','copy_history']})
          print('POST_EXPORT_JSON='+json.dumps(result,ensure_ascii=False))
          PY
