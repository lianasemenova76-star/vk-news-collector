name: Publish approved VK post

on:
  push:
    branches:
      - main
    paths:
      - "publish-request.json"

permissions:
  contents: read

concurrency:
  group: vk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate approved request and publish
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
        run: |
          CONFIRMED="$(jq -r '.confirmed' publish-request.json)"
          MESSAGE="$(jq -r '.message' publish-request.json)"
          test "$CONFIRMED" = "true"
          test -n "$MESSAGE"
          CONFIRM_PUBLISH=YES python publisher.py --message "$MESSAGE"
