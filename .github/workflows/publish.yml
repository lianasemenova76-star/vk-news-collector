name: Publish approved VK posts

on:
  push:
    branches:
      - main
    paths:
      - "publish-request.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate approved requests and publish
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
        run: |
          jq -e '.confirmed == true' publish-request.json
          COUNT=$(jq '.posts | length' publish-request.json)
          test "$COUNT" -gt 0
          for i in $(seq 0 $((COUNT-1))); do
            MESSAGE=$(jq -r ".posts[$i].message" publish-request.json)
            PUBLISH_DATE=$(jq -r ".posts[$i].publish_date // empty" publish-request.json)
            test -n "$MESSAGE"
            if [ -n "$PUBLISH_DATE" ]; then
              CONFIRM_PUBLISH=YES python publisher.py --message "$MESSAGE" --publish-date "$PUBLISH_DATE"
            else
              CONFIRM_PUBLISH=YES python publisher.py --message "$MESSAGE"
            fi
          done
