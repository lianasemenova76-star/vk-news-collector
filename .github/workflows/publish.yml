name: Publish approved VK post

on:
  push:
    branches:
      - main
    paths:
      - "publish-request.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate approved request and publish
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFIRMED="$(jq -r '.confirmed' publish-request.json)"
          MESSAGE="$(jq -r '.message' publish-request.json)"
          IMAGE_PATH="$(jq -r '.image_path // empty' publish-request.json)"
          PUBLISH_DATE="$(jq -r '.publish_date // empty' publish-request.json)"
          test "$CONFIRMED" = "true"
          test -n "$MESSAGE"
          PUBLISH_ARGS=()
          if [ -n "$PUBLISH_DATE" ]; then
            PUBLISH_ARGS+=(--publish-date "$PUBLISH_DATE")
          fi
          set +e
          if [ -n "$IMAGE_PATH" ]; then
            test -f "$IMAGE_PATH" || exit 3
            OUTPUT=$(CONFIRM_PUBLISH=YES python publisher.py --message "$MESSAGE" --image "$IMAGE_PATH" "${PUBLISH_ARGS[@]}" 2>&1)
          else
            OUTPUT=$(CONFIRM_PUBLISH=YES python publisher.py --message "$MESSAGE" "${PUBLISH_ARGS[@]}" 2>&1)
          fi
          RESULT=$?
          printf '%s\n' "$OUTPUT"
          if [ "$RESULT" -eq 0 ]; then
            POST_ID=$(printf '%s' "$OUTPUT" | python -c 'import json,sys; print(json.load(sys.stdin)["post_id"])')
            RESULT_STATUS=$(printf '%s' "$OUTPUT" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            STATE=success
            if [ "$RESULT_STATUS" = "scheduled" ]; then
              CONTEXT="vk-scheduled-$POST_ID"
              DESCRIPTION="approved VK post scheduled"
            else
              CONTEXT="vk-published-$POST_ID"
              DESCRIPTION="approved VK post published"
            fi
          else
            LAST_LINE=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -cd '[:alnum:] .:_-' | cut -c1-70)
            STATE=error
            CONTEXT="vk-publish-error-$LAST_LINE"
            DESCRIPTION="$LAST_LINE"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="$CONTEXT" -f description="$DESCRIPTION"
          exit "$RESULT"
