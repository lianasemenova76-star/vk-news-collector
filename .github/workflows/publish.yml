name: Publish approved VK posts

on:
  push:
    branches:
      - main
    paths:
      - "publish-request.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: vk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install story image support
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Validate approved requests and publish
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e '.confirmed == true' publish-request.json
          COUNT=$(jq '.posts | length' publish-request.json)
          test "$COUNT" -gt 0
          for i in $(seq 0 $((COUNT-1))); do
            MESSAGE=$(jq -r ".posts[$i].message" publish-request.json)
            PUBLISH_DATE=$(jq -r ".posts[$i].publish_date // empty" publish-request.json)
            IMAGE_PATH=$(jq -r ".posts[$i].image_path // empty" publish-request.json)
            IMAGE_URL=$(jq -r ".posts[$i].image_url // empty" publish-request.json)
            EDIT_POST_ID=$(jq -r ".posts[$i].edit_post_id // empty" publish-request.json)
            DUPLICATE_TO_STORY=$(jq -r ".posts[$i].duplicate_to_story // false" publish-request.json)
            STORY_TITLE=$(jq -r ".posts[$i].story_title // empty" publish-request.json)
            STORY_TEXT=$(jq -r ".posts[$i].story_text // empty" publish-request.json)
            test -n "$MESSAGE"
            ARGS=(--message "$MESSAGE")
            if [ -n "$PUBLISH_DATE" ]; then ARGS+=(--publish-date "$PUBLISH_DATE"); fi
            if [ -n "$EDIT_POST_ID" ]; then ARGS+=(--edit-post-id "$EDIT_POST_ID"); fi
            if [ -n "$IMAGE_URL" ]; then
              [[ "$IMAGE_URL" == https://* ]]
              IMAGE_PATH="$RUNNER_TEMP/vk-image-$i.jpg"
              python - "$IMAGE_URL" "$IMAGE_PATH" <<'PY'
import sys
from urllib.request import Request, urlopen
url, path = sys.argv[1:]
request = Request(url, headers={"User-Agent": "Mozilla/5.0", "Referer": "https://vk.com/"})
with urlopen(request, timeout=120) as response, open(path, "wb") as output:
    output.write(response.read())
PY
            elif [ -n "$IMAGE_PATH" ]; then
              [[ "$IMAGE_PATH" == media/* ]]
              test -f "$IMAGE_PATH"
            fi
            if [ -n "$IMAGE_PATH" ]; then ARGS+=(--image "$IMAGE_PATH"); fi
            if [ "$DUPLICATE_TO_STORY" = "true" ]; then
              test -z "$PUBLISH_DATE"
              test -n "$STORY_TITLE"
              ARGS+=(--duplicate-to-story --story-title "$STORY_TITLE")
              if [ -n "$STORY_TEXT" ]; then ARGS+=(--story-text "$STORY_TEXT"); fi
            fi
            set +e
            OUTPUT=$(CONFIRM_PUBLISH=YES python publisher.py "${ARGS[@]}" 2>&1)
            RESULT=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$RESULT" -eq 0 ]; then
              POST_ID=$(printf '%s' "$OUTPUT" | python -c 'import json,sys; print(json.load(sys.stdin)["post_id"])')
              STORY_ID=$(printf '%s' "$OUTPUT" | python -c 'import json,sys; data=json.load(sys.stdin); print((data.get("story") or {}).get("story_id", ""))')
              STATE=success
              if [ -n "$STORY_ID" ]; then
                DESCRIPTION="post $POST_ID and story $STORY_ID published"
                CONTEXT="vk-publish/post-$POST_ID-story-$STORY_ID"
              else
                DESCRIPTION="post $POST_ID published"
                CONTEXT="vk-publish/post-$POST_ID"
              fi
            else
              STATE=error
              DESCRIPTION=$(printf '%s' "$OUTPUT" | tail -n 1 | tr -cd '[:alnum:] .:_-' | cut -c1-70)
              CONTEXT="vk-publish/$DESCRIPTION"
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state="$STATE" -f context="$CONTEXT" -f description="$DESCRIPTION"
            if [ "$RESULT" -ne 0 ]; then exit "$RESULT"; fi
          done
