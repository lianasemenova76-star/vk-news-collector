name: Check VK publishing access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "publisher.py"
      - ".github/workflows/check-publish.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate VK publishing token
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
        run: python publisher.py --check

