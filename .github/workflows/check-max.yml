name: Check MAX publishing access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "max_diagnostic.py"
      - "max_publisher.py"
      - "tests/test_max_publisher.py"
      - ".github/workflows/check-max.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trust certificates required by MAX
        run: |
          cert_dir="/usr/local/share/ca-certificates/russian-trusted"
          sudo mkdir -p "$cert_dir"
          curl --fail --silent --show-error \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            -o /tmp/russian_trusted_root_ca_pem.crt
          curl --fail --silent --show-error \
            https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt \
            -o /tmp/russian_trusted_sub_ca_pem.crt
          curl --fail --silent --show-error \
            https://gu-st.ru/content/lending/russian_trusted_sub_ca_2024_pem.crt \
            -o /tmp/russian_trusted_sub_ca_2024_pem.crt
          sudo cp /tmp/russian_trusted_*.crt "$cert_dir/"
          sudo update-ca-certificates

      - name: Check token, channel and permissions
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: "-71487490488555"
        run: python max_diagnostic.py

      - name: Test guarded MAX publisher
        run: python -m unittest tests.test_max_publisher -v
