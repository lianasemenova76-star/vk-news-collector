name: Check MAX publishing access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "max_diagnostic.py"
      - ".github/workflows/check-max.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check token, channel and permissions
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: python max_diagnostic.py
