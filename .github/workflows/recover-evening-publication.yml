name: Recover approved evening publication
on:
  push:
    branches: [main]
    paths: [".github/workflows/recover-evening-publication.yml"]
permissions:
  contents: read
  actions: write
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cancel unstarted duplicate attempts and check prior results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 37642387281 37642387282 37642421247 37642421261; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
            if [ "$status" != completed ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel"
            fi
          done
          for run in 37642387281 37642387282 37642421247 37642421261; do
            for attempt in $(seq 1 20); do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)
              if [ "$status" = completed ]; then break; fi
              sleep 2
            done
            test "$status" = completed
          done
          for sha in 213bbec44e3f5cb83236c70d290b8eb547337e92 8c9710fb5593f70d304eea88d7026db5a02f9949; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" > /tmp/prior.json
            if jq -e '.statuses[]? | select(.state == "success" and (.context | test("^(vk-publish|MAX|[Mm]ax-publish)")))' /tmp/prior.json; then
              echo "Prior publication exists. Stop recovery to prevent duplicates."
              exit 1
            fi
          done
      - name: Prepare runtime and certificates
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          for cert in russian_trusted_root_ca_pem.crt russian_trusted_sub_ca_pem.crt russian_trusted_sub_ca_2024_pem.crt; do
            curl --fail --silent --show-error "https://gu-st.ru/content/lending/$cert" -o "/tmp/$cert"
            sudo cp "/tmp/$cert" "/usr/local/share/ca-certificates/$cert"
          done
          sudo update-ca-certificates
      - name: Publish the authorized six news posts
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: "-71487490488555"
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime, timezone, timedelta
          doc=json.load(open("publish-request.json"))
          assert doc["confirmed"] is True
          assert doc["request_id"] == "approved-news-20261007-evening-1802"
          posts=doc["posts"]
          vk=[p for p in posts if "vk" in p["targets"]]
          assert len(vk)==6
          original=vk[0]["publish_date"]
          start=max(original, int((time.time()+120+299)//300)*300)
          for i,p in enumerate(vk):
              p["publish_date"]=start+i*1800
          print("VK schedule:", [datetime.fromtimestamp(p["publish_date"], timezone(timedelta(hours=3))).isoformat() for p in vk], flush=True)
          for i,p in enumerate(posts):
              platform=p["targets"][0]
              args=["python", "max_publisher.py" if platform=="max" else "publisher.py", "--message", p["message"], "--source-post="+p["source_post"]]
              if platform=="vk":
                  args += ["--source-limit",str(p["source_limit"]),"--publish-date",str(p["publish_date"])]
              result=subprocess.run(args,env={**os.environ,"CONFIRM_PUBLISH":"YES"},capture_output=True,text=True)
              print(platform, i, result.stdout, result.stderr, flush=True)
              state="success" if result.returncode==0 else "error"
              description=(result.stdout.strip()[-100:] if state=="success" else "Publication failed; inspect logs")
              subprocess.run(["gh","api","--method","POST",f"repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}","-f","state="+state,"-f",f"context=evening-recovery/{platform}/{i}","-f","description="+description[:130]],check=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
