name: Targeted VK text archive
on:
  push:
    paths:
      - targeted-archive-request.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-vk-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read requested action
        id: intent
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          mode = json.loads(Path("targeted-archive-request.json").read_text(encoding="utf-8")).get("mode")
          from datetime import date
          if mode not in ("test", "full"):
              raise SystemExit("Expected 'mode' of 'test' or 'full'")
          print("mode="+mode)
          request=json.loads(Path("targeted-archive-request.json").read_text(encoding="utf-8"))
          pages=int(request.get("max_pages",2000))
          if not 1 <= pages <= 2000: raise SystemExit("Invalid max_pages")
          print("max_pages="+str(pages))
          start=request.get("start","2021-10-17")
          end=request.get("end","2026-10-17")
          if date.fromisoformat(start)>date.fromisoformat(end):raise SystemExit("Invalid date range")
          print("start="+start)
          print("end="+end)
          rewind=int(request.get("rewind_pages",0))
          if not 0<=rewind<=5:raise SystemExit("Invalid rewind_pages")
          print("rewind_pages="+str(rewind))
          PY
      - name: Verify Google Drive connection configured
        env:
          ARCHIVE_WEBAPP_URL: ${{ secrets.ARCHIVE_WEBAPP_URL }}
          ARCHIVE_WEBAPP_TOKEN: ${{ secrets.ARCHIVE_WEBAPP_TOKEN }}
        run: |
          if [ -z "$ARCHIVE_WEBAPP_URL" ] || [ -z "$ARCHIVE_WEBAPP_TOKEN" ]; then
            echo "::error::Set ARCHIVE_WEBAPP_URL and ARCHIVE_WEBAPP_TOKEN first"
            exit 1
          fi
      - name: Test connection and resumable offset
        env:
          ARCHIVE_WEBAPP_URL: ${{ secrets.ARCHIVE_WEBAPP_URL }}
          ARCHIVE_WEBAPP_TOKEN: ${{ secrets.ARCHIVE_WEBAPP_TOKEN }}
        run: |
          python - <<'PY'
          from targeted_archive import drive_call
          r = drive_call({"action": "status"})
          print("Connected to Google Drive. Next VK offset:", int(r["offset"]))
          PY
      - name: Collect historical matches directly into Google Sheets
        if: steps.intent.outputs.mode == 'full'
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          ARCHIVE_WEBAPP_URL: ${{ secrets.ARCHIVE_WEBAPP_URL }}
          ARCHIVE_WEBAPP_TOKEN: ${{ secrets.ARCHIVE_WEBAPP_TOKEN }}
        run: python targeted_archive.py --mode live --start "${{ steps.intent.outputs.start }}" --end "${{ steps.intent.outputs.end }}" --max-pages "${{ steps.intent.outputs.max_pages }}" --rewind-pages "${{ steps.intent.outputs.rewind_pages }}" --out "$RUNNER_TEMP/vk-results"
