name: Targeted VK text archive
on:
  push:
    paths:
      - "targeted-archive-request.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-vk-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect historical matches
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: |
          python targeted_archive.py --mode live --start 2021-10-17 --end 2026-10-17 --out "$RUNNER_TEMP/vk-results"
      - name: Save private results
        uses: actions/upload-artifact@v4
        with:
          name: targeted-vk-${{ github.run_id }}
          path: ${{ runner.temp }}/vk-results/
          retention-days: 3
          if-no-files-found: error
