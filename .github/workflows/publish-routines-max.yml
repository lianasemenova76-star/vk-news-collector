name: Publish routine MAX posts

on:
  push:
    branches:
      - main
    paths:
      - "routine-max-trigger.json"
  schedule:
    # Start 20 minutes early and wait for the exact publication time.
    # GitHub often delays workflows scheduled at the start of an hour.
    - cron: "40 2 * * *"
    - cron: "40 3 * * *"

permissions:
  contents: read

concurrency:
  group: max-routines
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trust certificates required by MAX
        run: |
          cert_dir="/usr/local/share/ca-certificates/russian-trusted"
          sudo mkdir -p "$cert_dir"
          for cert in \
            russian_trusted_root_ca_pem.crt \
            russian_trusted_sub_ca_pem.crt \
            russian_trusted_sub_ca_2024_pem.crt; do
            curl --fail --silent --show-error \
              "https://gu-st.ru/content/lending/$cert" \
              -o "/tmp/$cert"
            sudo cp "/tmp/$cert" "$cert_dir/"
          done
          sudo update-ca-certificates

      - name: Publish routine posts due now
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: "-71487490488555"
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          FILES=(good-morning-request.json horoscope-request.json)

          publish_message() {
            local message="$1"
            CONFIRM_PUBLISH=YES python max_publisher.py --message "$message"
          }

          if [ "$EVENT_NAME" = "push" ]; then
            for file in "${FILES[@]}"; do
              test -f "$file" || continue
              jq -e '.confirmed == true' "$file" >/dev/null
              COUNT=$(jq '.posts | length' "$file")
              for i in $(seq 0 $((COUNT-1))); do
                PUBLISH_DATE=$(jq -r ".posts[$i].publish_date // empty" "$file")
                if [ -z "$PUBLISH_DATE" ]; then
                  MESSAGE=$(jq -r ".posts[$i].message" "$file")
                  test -n "$MESSAGE"
                  echo "Publishing immediate MAX routine from $file post $i"
                  publish_message "$MESSAGE"
                fi
              done
            done
            exit 0
          fi

          case "$EVENT_SCHEDULE" in
            "40 2 * * *") EXPECTED_UTC_HOUR="03" ;;
            "40 3 * * *") EXPECTED_UTC_HOUR="04" ;;
            *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
          esac

          TARGET_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) ${EXPECTED_UTC_HOUR}:00:00 UTC" +%s)
          NOW_EPOCH=$(date -u +%s)
          if [ "$NOW_EPOCH" -lt "$TARGET_EPOCH" ]; then
            WAIT_SECONDS=$((TARGET_EPOCH - NOW_EPOCH))
            echo "Waiting ${WAIT_SECONDS}s for the exact publication time"
            sleep "$WAIT_SECONDS"
          fi

          TODAY_MSK=$(TZ=Europe/Moscow date +%Y-%m-%d)
          for file in "${FILES[@]}"; do
            test -f "$file" || continue
            jq -e '.confirmed == true' "$file" >/dev/null
            COUNT=$(jq '.posts | length' "$file")
            for i in $(seq 0 $((COUNT-1))); do
              PUBLISH_DATE=$(jq -r ".posts[$i].publish_date // empty" "$file")
              [ -n "$PUBLISH_DATE" ] || continue
              POST_DATE_MSK=$(TZ=Europe/Moscow date -d "@$PUBLISH_DATE" +%Y-%m-%d)
              POST_UTC_HOUR=$(TZ=UTC date -d "@$PUBLISH_DATE" +%H)
              if [ "$POST_DATE_MSK" = "$TODAY_MSK" ] && [ "$POST_UTC_HOUR" = "$EXPECTED_UTC_HOUR" ]; then
                MESSAGE=$(jq -r ".posts[$i].message" "$file")
                test -n "$MESSAGE"
                echo "Publishing scheduled MAX routine from $file post $i"
                publish_message "$MESSAGE"
              fi
            done
          done
