name: Cancel routine posts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "routine-max-trigger.json"

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cancel postponed good morning and horoscope posts
        env:
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          request = json.load(open("routine-max-trigger.json", encoding="utf-8"))
          if request.get("enabled", True):
              raise SystemExit("Cancellation request is not enabled")

          token = os.environ["VK_PUBLISH_TOKEN"]
          api_version = "5.199"
          owner_id = -70948047

          def api(method, **params):
              payload = {"access_token": token, "v": api_version, **params}
              req = Request(
                  f"https://api.vk.com/method/{method}",
                  data=urlencode(payload).encode("utf-8"),
                  headers={"User-Agent": "vk-news-collector-cancel/1.0"},
              )
              with urlopen(req, timeout=60) as response:
                  document = json.load(response)
              if "error" in document:
                  error = document["error"]
                  raise RuntimeError(
                      f"VK API error {error.get('error_code')}: "
                      f"{error.get('error_msg', 'unknown error')}"
                  )
              return document.get("response")

          response = api("wall.get", owner_id=owner_id, filter="postponed", count=100)
          items = response.get("items", []) if isinstance(response, dict) else []
          prefixes = ("🔵 ДОБРОЕ УТРО, ТУТАЕВ!", "ГОРОСКОП НА ")
          deleted = []
          kept = []

          for post in items:
              text = (post.get("text") or "").strip()
              if text.startswith(prefixes):
                  api("wall.delete", owner_id=owner_id, post_id=post["id"])
                  deleted.append({
                      "post_id": post["id"],
                      "publish_date": post.get("date"),
                      "title": text.splitlines()[0],
                  })
                  time.sleep(0.3)
              else:
                  kept.append(post.get("id"))

          print(json.dumps({
              "status": "cancelled",
              "deleted_count": len(deleted),
              "deleted": deleted,
              "other_postponed_posts_kept": kept,
              "max_schedule_enabled": False,
          }, ensure_ascii=False, indent=2))
          PY
