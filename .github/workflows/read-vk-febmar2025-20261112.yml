name: Read VK posts February March 2025
on:
  push:
    paths:
      - '.github/workflows/read-vk-febmar2025-20261112.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read historical public posts
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
          VK_PUBLISH_TOKEN: ${{ secrets.VK_PUBLISH_TOKEN }}
          VK_ANALYTICS_TOKEN: ${{ secrets.VK_ANALYTICS_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,time,datetime,urllib.request,urllib.parse
          tokens=list(dict.fromkeys(t for t in [os.getenv('VK_SERVICE_TOKEN'),os.getenv('VK_PUBLISH_TOKEN'),os.getenv('VK_ANALYTICS_TOKEN'),os.getenv('VK_USER_TOKEN')] if t))
          def api(offset,count):
              for token in tokens:
                  for retry in range(4):
                      time.sleep(.36)
                      data=urllib.parse.urlencode({'owner_id':-70948047,'offset':offset,'count':count,'filter':'all','access_token':token,'v':'5.199'}).encode()
                      with urllib.request.urlopen('https://api.vk.com/method/wall.get',data=data,timeout=60) as r:d=json.load(r)
                      if 'response' in d:return d['response']
                      if d.get('error',{}).get('error_code')==6:time.sleep(2);continue
                      break
              raise RuntimeError('VK API error '+str(d.get('error',{}).get('error_code')))
          tz=datetime.timezone(datetime.timedelta(hours=3))
          start=int(datetime.datetime(2025,2,1,tzinfo=tz).timestamp())
          end=int(datetime.datetime(2025,4,1,tzinfo=tz).timestamp())
          initial=api(0,100)
          lo,hi=0,initial['count']
          while hi-lo>1:
              mid=(lo+hi)//2
              items=api(mid,1)['items']
              if items and items[0]['date']>=end:lo=mid
              else:hi=mid
          offset=max(0,lo-100)
          seen=set();pages=0;emptytext=0;first=None;last=None
          while pages<100:
              items=api(offset,100)['items'];pages+=1
              if not items:break
              for p in items:
                  if start<=p['date']<end and p['id'] not in seen:
                      seen.add(p['id'])
                      q={k:p.get(k) for k in ['id','owner_id','date','text','copy_history','is_pinned']}
                      q['attachment_types']=[a.get('type') for a in p.get('attachments',[])]
                      if not q['text'] and not any(x.get('text') for x in q.get('copy_history') or []):emptytext+=1
                      print('HIST_POST_JSON='+json.dumps(q,ensure_ascii=False),flush=True)
              dates=[p['date'] for p in items if not p.get('is_pinned')]
              if dates:
                  first=max(first or max(dates),max(dates));last=min(last or min(dates),min(dates))
              if dates and min(dates)<start:break
              offset+=100
          print('HIST_SUMMARY_JSON='+json.dumps({'posts':len(seen),'emptytext':emptytext,'pages':pages,'scanned_newest':first,'scanned_oldest':last,'start':start,'end_exclusive':end,'complete':bool(last and last<start)}),flush=True)
          PY
