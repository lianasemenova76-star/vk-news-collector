name: Collect VK news

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 06:15, 12:15 and 18:15 Moscow time (UTC+3)
    - cron: "15 3,9,15 * * *"
  push:
    branches:
      - main
    paths:
      - "collector.py"
      - "sources.json"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect posts
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
        run: python collector.py

      - name: Save collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/archive/
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update VK news"
            git push
          fi
