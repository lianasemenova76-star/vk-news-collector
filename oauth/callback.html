<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Авторизация VK завершена</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2733;background:#f3f6f9}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{width:min(680px,calc(100% - 40px));padding:32px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 12px;font-size:24px}p{line-height:1.5}.ok{color:#16883d}.error{color:#c62828}.note{color:#65707c;font-size:14px}
    .secret{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}
    label{grid-column:1/-1;font-size:13px;color:#65707c}
    input{min-width:0;padding:10px;border:1px solid #cfd6dd;border-radius:8px;font:14px/1.2 monospace}
    button{padding:10px 14px;border:0;border-radius:8px;background:#07f;color:#fff;font:600 14px/1.2 inherit;cursor:pointer}
    #results[hidden]{display:none}
  </style>
</head>
<body>
  <main>
    <h1 id="title">Получаю новый ключ VK…</h1>
    <p id="message">Обмениваю одноразовый код на токены.</p>
    <section id="results" hidden>
      <p class="ok">VK выдал доступ. Скопируй значения по одному в GitHub Secrets. Не присылай их в чат и не делай скриншот.</p>
      <div class="secret"><label for="access">VK_USER_TOKEN</label><input id="access" type="password" readonly><button type="button" data-copy="access">Копировать</button></div>
      <div class="secret"><label for="refresh">VK_USER_REFRESH_TOKEN</label><input id="refresh" type="password" readonly><button type="button" data-copy="refresh">Копировать</button></div>
      <div class="secret"><label for="device">VK_USER_DEVICE_ID</label><input id="device" type="password" readonly><button type="button" data-copy="device">Копировать</button></div>
      <p id="meta" class="note"></p>
    </section>
    <p class="note">Эта страница не сохраняет токены в файлы, историю браузера или репозиторий.</p>
  </main>
  <script>
    const APP_ID = 54708342;
    const REDIRECT_URL = 'https://lianasemenova76-star.github.io/vk-news-collector/oauth/callback.html';
    const params = new URLSearchParams(location.search);
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const results = document.getElementById('results');

    function fail(text) {
      title.textContent = 'Авторизация не завершена';
      title.className = 'error';
      message.textContent = text;
    }

    async function run() {
      const error = params.get('error');
      if (error) {
        fail(params.get('error_description') || error);
        return;
      }

      const code = params.get('code');
      const deviceId = params.get('device_id');
      const returnedState = params.get('state');
      const state = sessionStorage.getItem('vk_oauth_state');
      const codeVerifier = sessionStorage.getItem('vk_code_verifier');

      history.replaceState({}, document.title, location.pathname);

      if (!code || !deviceId || !state || !codeVerifier) {
        fail('Не хватает данных авторизации. Вернись на страницу входа и начни ещё раз.');
        return;
      }
      if (returnedState && returnedState !== state) {
        fail('Проверка безопасности state не прошла. Начни авторизацию заново.');
        return;
      }

      try {
        const query = new URLSearchParams({
          grant_type: 'authorization_code',
          redirect_uri: REDIRECT_URL,
          client_id: String(APP_ID),
          code_verifier: codeVerifier,
          state,
          device_id: deviceId
        });

        const response = await fetch('https://id.vk.ru/oauth2/auth?' + query.toString(), {
          method: 'POST',
          body: new URLSearchParams({ code })
        });
        const token = await response.json();

        if (!response.ok || token.error) {
          throw new Error(token.error_description || token.error || 'VK не выдал токен');
        }
        if (token.state && token.state !== state) {
          throw new Error('Проверка безопасности state не прошла.');
        }

        sessionStorage.removeItem('vk_oauth_state');
        sessionStorage.removeItem('vk_code_verifier');

        document.getElementById('access').value = token.access_token || '';
        document.getElementById('refresh').value = token.refresh_token || '';
        document.getElementById('device').value = deviceId;
        document.getElementById('meta').textContent =
          'Выданные права: ' + (token.scope || 'VK не вернул список') +
          '. Срок access token: ' + (token.expires_in || 'не указан') + ' секунд.';

        title.textContent = 'Новый ключ VK получен';
        title.className = 'ok';
        message.textContent = 'Теперь сохрани три значения в GitHub Secrets.';
        results.hidden = false;
      } catch (error) {
        fail(error?.message || String(error));
      }
    }

    document.addEventListener('click', async (event) => {
      const id = event.target?.dataset?.copy;
      if (!id) return;
      const input = document.getElementById(id);
      try {
        await navigator.clipboard.writeText(input.value);
      } catch {
        input.type = 'text';
        input.select();
        document.execCommand('copy');
        input.type = 'password';
      }
      const old = event.target.textContent;
      event.target.textContent = 'Скопировано';
      setTimeout(() => { event.target.textContent = old; }, 1200);
    });

    run();
  </script>
</body>
</html>
