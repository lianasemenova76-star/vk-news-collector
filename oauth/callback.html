<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Авторизация VK завершена</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6f9; color: #1d2733; }
    main { width: min(560px,calc(100% - 40px)); padding: 32px; background: #fff; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 8px 0; line-height: 1.5; }
    .ok { color: #16883d; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Возврат из VK</h1>
    <p id="message">Проверяю результат авторизации…</p>
    <p>Страницу можно закрыть после завершения настройки.</p>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.slice(1));
    const error = query.get("error") || hash.get("error");
    const hasResult = query.has("code") || hash.has("access_token");
    const title = document.getElementById("title");
    const message = document.getElementById("message");
    if (error) {
      title.textContent = "Авторизация не завершена";
      title.className = "error";
      message.textContent = query.get("error_description") || hash.get("error_description") || error;
    } else if (hasResult) {
      title.textContent = "Авторизация VK завершена";
      title.className = "ok";
      message.textContent = "VK вернул данные авторизации. Вернитесь к настройке публикации.";
    } else {
      message.textContent = "Страница возврата готова.";
    }
  </script>
</body>
</html>
